stages:
  validate:
    cmd: >-
      python pipeline/scripts/validate.py
      --coco data/raw/coco.json
      --out data/processed/coco.validated.json
    deps:
      - data/raw/coco.json
      - pipeline/src/dataset_pipeline/coco
      - pipeline/scripts/validate.py
    outs:
      - data/processed/coco.validated.json

  analyze:
    cmd: >-
      python pipeline/scripts/analyze.py
      --coco data/processed/coco.validated.json
      --images-dir data/raw/images
      --quality-policy quality.yaml
      --out data/processed/quality_metrics.json
    deps:
      - data/processed/coco.validated.json
      - data/raw/images
      - pipeline/src/dataset_pipeline/analyzers
      - pipeline/scripts/analyze.py
      - quality.yaml
    outs:
      - data/processed/quality_metrics.json

  gate:
    # Compuerta de calidad (Frente 4): si un check `severity: fail` no
    # pasa, este comando termina con exit != 0 y `dvc repro` se detiene
    # aquí -- `split` ni siquiera arranca, porque depende de este output.
    # No recalcula nada del propio `analyze`: vuelve a cargar el COCO ya
    # validado y aplica quality.yaml directo, para que la compuerta sea
    # el único lugar que decide pass/fail (una sola fuente de verdad).
    cmd: >-
      python -m dataset_pipeline.quality_gate.cli
      --coco data/processed/coco.validated.json
      --policy quality.yaml
      --output data/processed/quality.json
    deps:
      - data/processed/coco.validated.json
      - pipeline/src/dataset_pipeline/quality_gate
      - quality.yaml
    outs:
      - data/processed/quality.json

  split:
    cmd: >-
      python pipeline/scripts/split.py
      --coco data/processed/coco.validated.json
      --splits-config splits.yaml
      --quality-metrics data/processed/quality_metrics.json
      --out data/processed/splits.json
    deps:
      - data/processed/coco.validated.json
      - data/processed/quality_metrics.json
      - data/processed/quality.json
      - pipeline/src/dataset_pipeline/splits
      - pipeline/scripts/split.py
      - splits.yaml
    outs:
      - data/processed/splits.json
