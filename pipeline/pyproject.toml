[project]
name = "dataset-pipeline"
version = "0.1.0"
description = "Pipeline de calidad y versionado de datasets (Proyecto 2, MLOps)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "mcp>=2.0,<3",
    "google-genai>=1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "ruff>=0.6",
    "dvc[s3]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "requiere_minio: necesita un remote DVC (MinIO) alcanzable; se salta si no lo está",
    "requiere_gemini_api_key: llama a la API real de Gemini; se salta si GEMINI_API_KEY no está configurada",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
