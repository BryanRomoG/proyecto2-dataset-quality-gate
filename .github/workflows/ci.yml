name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint & format check (Biome)
        run: npm run check

      - name: Unit/component tests (Vitest)
        run: npm test

      - name: Copy .env for CI
        run: cp .env.example .env

      - name: Start MariaDB + MinIO (wait for healthy)
        run: docker compose up mariadb minio -d --wait --wait-timeout 60

      - name: Run migrations and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Tear down
        if: always()
        run: docker compose down -v