name: Pipeline CI (Python)

# Separado de ci.yml (stack Node del portal, T-4.3/Josue) a propósito: son
# dos ecosistemas independientes (npm vs pip) con triggers/pasos distintos
# — un solo archivo mezclando ambos sería más frágil y más difícil de leer
# cuando algo falla.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests (pytest, incluye BDD vía pytest-bdd)
        run: pytest -v

      - name: Quality gate smoke test
        # El dataset real vive en DVC/S3, no en este checkout -- así que
        # esto no puede correr contra los datos reales aquí. Corre la
        # compuerta de verdad (mismo CLI que usa dvc.yaml) contra fixtures
        # ya versionadas, en las dos direcciones: confirma que pasa cuando
        # debe pasar, y que bloquea (exit != 0) cuando debe bloquear -- sin
        # dejar el job en rojo si la compuerta hizo bien su trabajo.
        run: |
          python -m dataset_pipeline.quality_gate.cli \
            --coco tests/quality_gate/fixtures/coco.two_classes.json \
            --policy tests/quality_gate/fixtures/quality.pass.yaml \
            --output /tmp/gate-pass.json
          echo "OK: la compuerta pasó con un umbral alcanzable"

          if python -m dataset_pipeline.quality_gate.cli \
            --coco tests/quality_gate/fixtures/coco.two_classes.json \
            --policy tests/quality_gate/fixtures/quality.impossible_threshold.yaml \
            --output /tmp/gate-fail.json; then
            echo "ERROR: la compuerta debía bloquear con un umbral imposible y no lo hizo"
            exit 1
          fi
          echo "OK: la compuerta bloqueó (exit != 0) con un umbral imposible, como se esperaba"
